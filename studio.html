<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0b">
<title>JR’SBEAUTYBAR Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true"><span class="wordmark script">JR’s beauty bar</span><b>Studio</b><i></i></div>
<div id="app"><p style="padding:24px">De salon wordt geladen…</p></div>
<div id="chat"></div>
<div id="overlay"></div>
<div id="story"></div>
<div id="toast" aria-live="polite"></div>
<noscript><p style="padding:24px">Zet JavaScript aan om JR’SBEAUTYBAR te gebruiken.</p></noscript>
<script>window.APP_MODE='studio';if(!location.hash)history.replaceState(null,'','#werk');</script>
<script src="engine.js"></script>
<script src="art.js"></script>
<script src="scenarios.js"></script>
<script src="ui-core.js"></script>
<script src="ui-client.js"></script>
<script src="ui-work.js"></script>
<script src="ui-media.js"></script>
<script src="ui-pages.js"></script>
<script src="ui-feed.js"></script>
<script src="ui-shop.js"></script>
<script src="ui-system.js"></script>
<script>window.APP.render();setTimeout(()=>{const s=document.getElementById('splash');if(s){s.classList.add('out');setTimeout(()=>s.remove(),700)}},1300);</script>
</body>
</html>
